apply plugin: 'com.android.application'
//Apply Google Services plugin
apply plugin: 'com.google.gms.google-services'
// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'
//Apply Secret Gradle plugin
//apply plugin: "com.google.secrets_gradle_plugin"

def fullApplicationName = "InstaGuard"
def fullApplicationName_source = "_user"

def fullApplicationId = "com.instaguard.user"
def fullVersionName = "1.2" // old 1.1
def fullVersionCode = 3 // old 2
//def fullBuildToolsVersion = "30.0.0"
def sdkVersion = 34
def minSdk = 24

//Push Notification
def work_version = "2.7.1"

android {
    namespace "com.instaguard.user"
    compileSdkVersion sdkVersion
    //buildToolsVersion fullBuildToolsVersion
    defaultConfig {
        applicationId fullApplicationId
        minSdkVersion minSdk
        targetSdkVersion sdkVersion
        versionCode fullVersionCode
        versionName fullVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": android.defaultConfig.applicationId]
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }

        archivesBaseName = "$fullApplicationName$fullApplicationName_source-v$versionCode($versionName)"
        //signingConfig signingConfigs.debug

        Properties properties = new Properties();
        properties.load(project.rootProject.file("local.properties").newDataInputStream())
        buildConfigField "String", "API_KEY", "\"${properties.getProperty("API_KEY")}\""
        // Share the key with your `AndroidManifest.xml`
        manifestPlaceholders = [API_KEY: "${properties.getProperty('API_KEY')}"]

        resConfigs "fi","en","ar","si"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {

        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    dataBinding {
        enabled = true
    }

    useLibrary 'org.apache.http.legacy'
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    //Remove Paypal Unwanted usages
    packagingOptions {
        exclude 'AndroidManifest.xml'
        exclude 'lib/arm64-v8a/libcardioDecider.so'
        exclude 'lib/arm64-v8a/libcardioRecognizer.so'
        exclude 'lib/arm64-v8a/libcardioRecognizer_tegra2.so'
        exclude 'lib/arm64-v8a/libopencv_core.so'
        exclude 'lib/arm64-v8a/libopencv_imgproc.so'
        exclude 'lib/armeabi/libcardioDecider.so'
        exclude 'lib/armeabi-v7a/libcardioDecider.so'
        exclude 'lib/armeabi-v7a/libcardioRecognizer.so'
        exclude 'lib/armeabi-v7a/libcardioRecognizer_tegra2.so'
        exclude 'lib/armeabi-v7a/libopencv_core.so'
        exclude 'lib/armeabi-v7a/libopencv_imgproc.so'
        exclude 'lib/mips/libcardioDecider.so'
        exclude 'lib/x86/libcardioDecider.so'
        exclude 'lib/x86/libcardioRecognizer.so'
        exclude 'lib/x86/libcardioRecognizer_tegra2.so'
        exclude 'lib/x86/libopencv_core.so'
        exclude 'lib/x86/libopencv_imgproc.so'
        exclude 'lib/x86_64/libcardioDecider.so'
        exclude 'lib/x86_64/libcardioRecognizer.so'
        exclude 'lib/x86_64/libcardioRecognizer_tegra2.so'
        exclude 'lib/x86_64/libopencv_core.so'
        exclude 'lib/x86_64/libopencv_imgproc.so'
    }

    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }
    buildFeatures {
        buildConfig = true
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'


    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    //firebase
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    //Social Network
    implementation 'com.facebook.android:facebook-android-sdk:13.0.0'
    implementation "com.google.android.gms:play-services-auth:21.2.0"

    /*implementation ('com.twitter.sdk.android:twitter:3.0.0@aar') {
        transitive = true
    }
    //Include all the Twitter APIs
    implementation 'com.twitter.sdk.android:twitter:3.3.0'

    //include only the necessary dependencies to avoid the Android dex limit
    implementation 'com.twitter.sdk.android:twitter-core:3.3.0'*/

    implementation 'org.twitter4j:twitter4j-core:4.0.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    //implementation 'com.github.Mindinventory:LinkedInLogin:0.0.3'

    //Google direction
    implementation 'com.akexorcist:googledirectionlibrary:1.1.1'

