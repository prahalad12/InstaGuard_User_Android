// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url "https://maven.google.com"
        }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'
        classpath 'com.google.gms:google-services:4.4.1'

        classpath "com.google:plugin:0.6.1"

        // Add the Crashlytics Gradle plugin (be sure to add version
        // 2.0.0 or later if you built your app with Android Studio 4.1).
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }
        maven {
            url  "https://cardinalcommerceprod.jfrog.io/artifactory/android"
            // Credentials are read from local.properties (git-ignored) or environment
            // variables so they are never committed. See local.properties for the keys:
            //   cardinal.username / cardinal.password
            def cardinalProps = new Properties()
            def localPropsFile = rootProject.file('local.properties')
            if (localPropsFile.exists()) {
                localPropsFile.withInputStream { cardinalProps.load(it) }
            }
            credentials {
                username cardinalProps.getProperty('cardinal.username', System.getenv('CARDINAL_USERNAME'))
                password cardinalProps.getProperty('cardinal.password', System.getenv('CARDINAL_PASSWORD'))
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
